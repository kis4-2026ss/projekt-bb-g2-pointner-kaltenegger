<div class="app-wrapper">
  <header class="add-container">
    <h1 class="app-title">Todo App</h1>

    <div class="input-row">
      <input
        type="text"
        class="input-field"
        [(ngModel)]="newTitle"
        placeholder="Neues Todo hinzufügen..."
      />
    </div>
    <div class="input-row">
      <input type="date" class="input-field" [(ngModel)]="newDueDate" />

      <select class="input-field" [(ngModel)]="newPriority">
        <option value="low">Niedrig</option>
        <option value="medium">Mittel</option>
        <option value="high">Hoch</option>
      </select>

      <button class="btn btn-primary" (click)="addTodo()">Hinzufügen</button>
    </div>

    <div class="filter-tabs">
      <button
        class="tab-btn"
        [class.tab-active]="activeFilter === 'all'"
        (click)="activeFilter = 'all'"
      >
        Alle
      </button>
      <button
        class="tab-btn"
        [class.tab-active]="activeFilter === 'active'"
        (click)="activeFilter = 'active'"
      >
        Aktiv
      </button>
      <button
        class="tab-btn"
        [class.tab-active]="activeFilter === 'done'"
        (click)="activeFilter = 'done'"
      >
        Erledigt
      </button>
    </div>
  </header>

  <ul class="todo-list">
    <li
      *ngFor="let todo of filteredTodos; trackBy: trackById"
      class="todo-item"
      [class.todo-done]="todo.done"
    >
      <input
        type="checkbox"
        class="todo-checkbox"
        [checked]="todo.done"
        (change)="todoService.toggle(todo.id)"
      />

      <span class="todo-title">{{ todo.title }}</span>

      <span class="priority-badge priority-{{ todo.priority }}">
        {{ todo.priority }}
      </span>

      <span class="due-date">{{ todo.dueDate }}</span>

      <button class="btn btn-danger" (click)="todoService.delete(todo.id)">
        Löschen
      </button>
    </li>
  </ul>

  <button class="btn btn-secondary" (click)="todoService.clearAll()">Liste leeren</button>
</div>
