<header class="add-container">
  <h1 class="app-title">Todo App</h1>

  <div class="input-row">
    <input
      type="text"
      class="input-field"
      [(ngModel)]="newTitle"
      placeholder="Neues Todo hinzufügen..."
    />

    <input type="date" [(ngModel)]="newDueDate" />

    <select [(ngModel)]="newPriority">
      <option value="low">Niedrig</option>
      <option value="medium">Mittel</option>
      <option value="high">Hoch</option>
    </select>

    <button class="btn btn-primary" (click)="addTodo()">Hinzufügen</button>
  </div>

  <div class="filter-tabs">
    <button
      class="tab-btn"
      [class.tab-active]="activeFilter === 'all'"
      (click)="activeFilter = 'all'"
    >
      Alle
    </button>
    <button
      class="tab-btn"
      [class.tab-active]="activeFilter === 'active'"
      (click)="activeFilter = 'active'"
    >
      Aktiv
    </button>
    <button
      class="tab-btn"
      [class.tab-active]="activeFilter === 'done'"
      (click)="activeFilter = 'done'"
    >
      Erledigt
    </button>
  </div>
</header>

<!-- Dieser Div sorgt dafür, dass die Liste unter dem Header startet -->
<div class="header-spacer"></div>

<!-- Liste in einen Container, um Abstand zu wahren -->
<main style="padding: 20px;">
  <ul class="todo-list">
    <li
      *ngFor="let todo of filteredTodos; let i = index"
      class="todo-item"
      [class.todo-done]="todo.done"
    >
      <input
        type="checkbox"
        class="todo-checkbox"
        [checked]="todo.done"
        (change)="todoService.toggle(i)"
      />

      <span class="todo-title">{{ todo.title }}</span>

      <span class="priority-badge priority-{{ todo.priority }}">
        {{ todo.priority }}
      </span>

      <span class="due-date">{{ todo.dueDate }}</span>

      <button class="btn btn-danger" (click)="todoService.delete(i)">
        Löschen
      </button>
    </li>
  </ul>

  <div class="footer-actions">
    <button class="btn btn-danger" (click)="todoService.clearAll()">Liste leeren</button>
  </div>
</main>
